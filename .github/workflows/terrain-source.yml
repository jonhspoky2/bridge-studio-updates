name: Validate terrain sources

on:
  push:
    paths:
      - 'src/**'
      - 'updates/v0.19.2/**'
      - 'updates/v0.19.1/**'
      - 'updates/v0.19.2/**'
      - 'tools/build_studio.py'
      - 'tests/terrain-core.cjs'
      - 'tests/terrain-walk.cjs'
      - 'tests/terrain-slope.cjs'
      - 'tests/terrain-paint.cjs'
      - 'tests/terrain-browser.cjs'
      - 'tests/terrain-sculpt.cjs'
      - 'tests/terrain-sculpt-performance.cjs'
      - 'tests/terrain-sculpt-browser.cjs'
      - '.github/workflows/terrain-source.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'updates/v0.19.1/**'
      - 'tools/build_studio.py'
      - 'tests/terrain-core.cjs'
      - 'tests/terrain-walk.cjs'
      - 'tests/terrain-slope.cjs'
      - '.github/workflows/terrain-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrain:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source syntax
        run: |
          node --check src/terrain_core.js
          node --check tests/terrain-slope.cjs
          node --check src/terrain_sculpt.js
          node --check src/game_runtime.js
          node --check src/studio.js
          python3 -m py_compile tools/build_studio.py
      - name: Build pre-release editor and validate file budget
        run: |
          python3 tools/build_studio.py --output /tmp/bridge-v0190-preview.html
          python3 - <<'PY'
          from pathlib import Path
          html=Path('/tmp/bridge-v0190-preview.html').read_text(encoding='utf-8')
          assert '/* @bridge:' not in html
          assert 'BridgeTerrainSculpt' in html
          assert 'BridgeTerrainPaint' in html
          print('Terrain 0.19.1 preview bytes',len(html.encode('utf-8')))
          PY
      - name: Verify v0.19.2 release candidate reproducibility
        run: |
          # v0.19.2 is an immutable signed release. New source changes are
          # expected to differ, so verify its archived bytes, not source parity.
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          payload=Path('updates/v0.19.2/studio.html').read_bytes()
          assert len(payload)==349645
          assert hashlib.sha256(payload).hexdigest()=='ddd943b351e5cd92243c0b6c94c67be990c92350b85f713cf24d199932a0a8f6'
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data=Path('updates/v0.19.2/studio.html').read_bytes()
          assert 250000 < len(data) < 1000000
          print('BRIDGE_V0192_SIZE='+str(len(data)))
          print('BRIDGE_V0192_SHA256='+hashlib.sha256(data).hexdigest())
          PY
      - name: Run terrain geometry and surface tests
        run: |
          node tests/terrain-core.cjs
          node tests/terrain-walk.cjs
          node tests/terrain-slope.cjs
          node tests/terrain-sculpt.cjs
          node tests/terrain-paint.cjs
          node tests/terrain-paint-performance.cjs
          node tests/terrain-sculpt-performance.cjs
      - name: Build single-file editor from sources
        run: |
          python3 tools/build_studio.py --output /tmp/bridge-terrain-studio.html
          python3 - <<'PY'
          from pathlib import Path
          html=Path('/tmp/bridge-terrain-studio.html').read_text(encoding='utf-8')
          assert '/* @bridge:' not in html
          assert html.count('BridgeTerrainCore')>=4
          assert 'embedded-terrain-core' in html
          assert 'terrainDemo' in html
          print('Built editor:', len(html.encode('utf-8')), 'bytes')
          PY

      - name: Upload unsigned v0.19.4 build for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: bridge-v0194-candidate-unsigned
          path: /tmp/bridge-terrain-studio.html
          if-no-files-found: error

      - name: Stage candidate payload on feature branch (manifest unchanged)
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/v0.19.4-slower-early-slope-slide'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updates/v0.19.4
          cp /tmp/bridge-terrain-studio.html updates/v0.19.4/studio.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/v0.19.3/studio.html
          if ! git diff --cached --quiet; then
            git commit -m 'Stage unsigned v0.19.4 editor payload (manifest stays 0.19.3)'
            git push origin HEAD:fix/v0.19.4-slower-early-slope-slide
          fi

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install browser testing dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 three@0.128.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Terrain browser integration (SwiftShader WebGL)
        run: |
          node tests/terrain-browser.cjs
          node tests/terrain-sculpt-browser.cjs
      - name: Upload Terrain Sculpt visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-v0190-screenshots
          path: tests/screenshots/*.png
          if-no-files-found: ignore
